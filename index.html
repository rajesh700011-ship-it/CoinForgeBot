  <style>
:root {
  --bg: #050c1e;
  --card: #0d1a36;
  --card-2: #12244a;
  --line: #1f3a6d;
  --line-2: #2b5299;
  --text: #f3f7ff;
  --muted: #8fa4cc;
  --gold: #ffd12e;
  --gold-2: #f5a800;
  --blue: #1f7bff;
  --green: #3ddc84;
  --purple: #a06bff;
  --bad: #ff6b6b;
  --font: 'Inter', 'Segoe UI', system-ui, -apple-system, sans-serif;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font-family: var(--font); font-size: 14px; line-height: 1.4; }
body {
  overflow: hidden;
  background:
    radial-gradient(90% 40% at 50% 0%, rgba(31, 123, 255, 0.20), transparent 70%),
    linear-gradient(180deg, #071330 0%, #050c1e 55%);
}
button { font-family: inherit; color: inherit; }
h1, h2, h3, p { margin: 0; }

.view { position: relative; height: 100%; overflow-y: auto; padding: 12px 16px calc(96px + env(safe-area-inset-bottom)); max-width: 560px; margin: 0 auto; }
.muted { color: var(--muted); }
.small { font-size: 12px; }
.gold { color: var(--gold); }
.pos { color: var(--green); }
.neg { color: var(--bad); }

/* ---------- icons ---------- */
.ic { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.ic.sm { width: 18px; height: 18px; }
.ic.lg { width: 26px; height: 26px; }
.tile { width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; flex: none; background: rgba(31, 123, 255, 0.16); color: #6fb0ff; }
.tile.gold { background: linear-gradient(145deg, #ffd12e, #f59a00); color: #3a2500; box-shadow: 0 0 18px rgba(255, 190, 40, 0.35); }
.tile.green { background: rgba(61, 220, 132, 0.16); color: var(--green); }
.tile.purple { background: rgba(160, 107, 255, 0.18); color: var(--purple); }
.tile.round { border-radius: 50%; }

/* ---------- header ---------- */
.top { display: flex; align-items: center; gap: 12px; min-height: 44px; margin-bottom: 8px; }
.top h2 { flex: 1; font-size: 18px; font-weight: 600; }
.top .logo { width: 30px; height: 30px; border-radius: 50%; object-fit: cover; box-shadow: 0 0 14px rgba(255, 170, 40, 0.5); }
.iconbtn { width: 38px; height: 38px; display: grid; place-items: center; border: 0; background: none; border-radius: 12px; cursor: pointer; color: var(--text); }
.iconbtn.boxed { background: rgba(31, 123, 255, 0.16); color: #6fb0ff; width: 34px; height: 34px; border-radius: 10px; }

/* ---------- surfaces ---------- */
.card { background: linear-gradient(180deg, #0f2144, #0b1731); border: 1px solid var(--line); border-radius: 16px; padding: 14px; margin-bottom: 12px; }
.card.glow-green { border-color: #1f8f5a; box-shadow: 0 0 0 1px rgba(61, 220, 132, 0.12), 0 0 26px rgba(61, 220, 132, 0.10); }
.card.flat { background: rgba(13, 26, 54, 0.75); }
.row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.label { font-size: 12.5px; color: var(--muted); }
.big { font-size: 30px; font-weight: 800; letter-spacing: -0.02em; line-height: 1.1; }
.big small { font-size: 15px; font-weight: 700; margin-left: 4px; color: var(--text); }
.sub { font-size: 12.5px; color: var(--muted); margin-top: 2px; }

.kv { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 11px 0; border-top: 1px solid rgba(43, 82, 153, 0.35); font-size: 13.5px; }
.kv:first-child { border-top: 0; }
.kv span:first-child { color: var(--muted); }
.kv b { font-weight: 600; }

/* ---------- buttons ---------- */
.btn { width: 100%; min-height: 48px; border: 0; border-radius: 12px; padding: 12px 16px; font-size: 15.5px; font-weight: 700; color: #1a1200; cursor: pointer;
  background: linear-gradient(180deg, #ffd92f, #f7b500); box-shadow: 0 6px 20px rgba(255, 190, 30, 0.22); display: flex; align-items: center; justify-content: center; gap: 8px; transition: transform 0.12s ease, opacity 0.2s; }
.btn:active { transform: scale(0.98); }
.btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; box-shadow: none; }
.btn.blue { background: linear-gradient(180deg, #2f8bff, #1a6df0); color: #fff; box-shadow: 0 6px 20px rgba(31, 123, 255, 0.28); }
.btn.ghost { background: rgba(31, 123, 255, 0.12); border: 1px solid var(--line-2); color: var(--text); box-shadow: none; }
.btn:focus-visible, .nav button:focus-visible, .iconbtn:focus-visible, input:focus-visible, .menu button:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }

/* ---------- home ---------- */
.homehero { display: flex; align-items: center; gap: 14px; padding: 6px 0 14px; }
.homehero img { width: 84px; height: 84px; border-radius: 50%; object-fit: cover; box-shadow: 0 0 34px rgba(255, 160, 40, 0.55); flex: none; }
.homehero h1 { font-size: 30px; font-weight: 800; letter-spacing: -0.02em; background: linear-gradient(180deg, #ffe066, #f59a00); -webkit-background-clip: text; background-clip: text; color: transparent; }
.homehero p { font-size: 13px; color: var(--text); opacity: 0.85; }

.stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-bottom: 12px; }
.stat { background: linear-gradient(180deg, #0f2144, #0b1731); border: 1px solid var(--line); border-radius: 14px; padding: 10px 4px 9px; text-align: center; display: grid; justify-items: center; gap: 4px; }
.stat .tile { width: 34px; height: 34px; border-radius: 50%; }
.stat .label { font-size: 10.5px; }
.stat b { font-size: 12.5px; font-weight: 700; line-height: 1.1; }
.stat b i { display: block; font-style: normal; font-size: 10px; font-weight: 500; color: var(--muted); }

.st { font-size: 12.5px; display: inline-flex; align-items: center; gap: 6px; font-weight: 600; }
.st .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
.st.running { color: var(--green); } .st.running .dot { background: var(--green); box-shadow: 0 0 8px var(--green); }
.st.ready { color: var(--gold); } .st.ready .dot { background: var(--gold); box-shadow: 0 0 8px var(--gold); }
.bar { height: 8px; border-radius: 99px; background: #10285a; overflow: hidden; margin: 12px 0 10px; }
.bar i { display: block; height: 100%; width: 0; border-radius: 99px; background: linear-gradient(90deg, #22b866, #5cf0a0); box-shadow: 0 0 10px rgba(61, 220, 132, 0.6); transition: width 0.9s linear; }

.linkcard { display: flex; align-items: center; gap: 12px; text-align: left; width: 100%; cursor: pointer; }
.linkcard h3 { font-size: 15px; font-weight: 700; color: var(--gold); }
.linkcard .go { width: 34px; height: 34px; border-radius: 50%; background: linear-gradient(180deg, #ffd92f, #f7b500); color: #3a2500; display: grid; place-items: center; margin-left: auto; flex: none; }
.plainbtn { background: none; border: 0; padding: 0; }

/* ---------- hero art ---------- */
.hero { position: relative; margin: 0 -16px 10px; height: 178px; overflow: hidden; }
.hero svg.art { position: absolute; inset: 0; width: 100%; height: 100%; }
.hero .coin-art { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); width: 118px; height: 118px; border-radius: 50%; object-fit: cover; box-shadow: 0 0 46px rgba(255, 150, 30, 0.65); }
.hero::after { content: ''; position: absolute; left: 0; right: 0; bottom: 0; height: 46px; background: linear-gradient(180deg, transparent, var(--bg)); pointer-events: none; }
.hero.short { height: 150px; }
.herotext { text-align: center; margin-bottom: 14px; }
.herotext h2 { font-size: 22px; font-weight: 800; }
.herotext p { font-size: 13px; color: #6fd0a0; margin-top: 4px; }
.herotext p.plain { color: var(--text); font-size: 17px; font-weight: 600; line-height: 1.35; }

/* ---------- mining ---------- */
.ring { position: relative; width: 150px; height: 150px; margin: 4px auto 14px; }
.ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
.ring .track { fill: #071331; stroke: rgba(255, 209, 46, 0.14); stroke-width: 5; }
.ring .fg { fill: none; stroke: url(#forgeGrad); stroke-width: 5; stroke-linecap: round; stroke-dasharray: 326.7; stroke-dashoffset: 326.7; transition: stroke-dashoffset 0.9s linear; filter: drop-shadow(0 0 7px rgba(255, 190, 40, 0.75)); }
.ring .mid { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; }
.ring .clock { font-size: 26px; font-weight: 800; letter-spacing: -0.01em; font-variant-numeric: tabular-nums; }
.ring .cl { font-size: 11.5px; color: var(--muted); }
.mrow { display: flex; align-items: center; gap: 12px; padding: 9px 0; }
.mrow .l { font-size: 12px; color: var(--muted); }
.mrow .v { font-size: 15px; font-weight: 700; font-variant-numeric: tabular-nums; }
.note { display: flex; align-items: center; gap: 10px; font-size: 12px; color: var(--muted); }
.note .ic { color: #6fb0ff; }

/* ---------- bonus ---------- */
.tag { font-size: 12.5px; color: var(--muted); }
.reward { font-size: 24px; font-weight: 800; }

/* ---------- referral ---------- */
.linkfield { display: flex; align-items: center; gap: 8px; background: #071331; border: 1px solid var(--line); border-radius: 12px; padding: 6px 6px 6px 12px; margin: 8px 0 10px; }
.linkfield span { flex: 1; min-width: 0; font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.rw { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-top: 1px solid rgba(43, 82, 153, 0.35); font-size: 13.5px; }
.rw:first-of-type { border-top: 0; }
.rw .tile { width: 30px; height: 30px; border-radius: 8px; }
.rw b { margin-left: auto; color: var(--gold); font-weight: 700; }

/* ---------- lists / chips ---------- */
.chip { font-size: 11.5px; font-weight: 600; padding: 3px 9px; border-radius: 8px; background: rgba(255, 255, 255, 0.08); }
.chip.completed { color: var(--green); background: rgba(61, 220, 132, 0.14); }
.chip.pending { color: var(--gold); background: rgba(255, 209, 46, 0.12); }
.chip.rejected { color: var(--bad); background: rgba(255, 107, 107, 0.12); }
.net { font-size: 11px; padding: 2px 7px; border-radius: 6px; background: rgba(31, 123, 255, 0.18); color: #7db8ff; font-weight: 600; }
.empty { color: var(--muted); font-size: 13.5px; padding: 6px 0 2px; }
.wrow { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; padding: 12px 0; border-top: 1px solid rgba(43, 82, 153, 0.35); }
.wrow:first-child { border-top: 0; }
.wrow b { font-size: 15px; }
.pcard { background: linear-gradient(180deg, #0f2144, #0b1731); border: 1px solid var(--line); border-radius: 14px; padding: 13px 14px; margin-bottom: 10px; }
.pcard .meta { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-top: 8px; font-size: 12px; color: var(--muted); }

/* ---------- profile / settings ---------- */
.who { display: flex; align-items: center; gap: 14px; margin: 4px 0 14px; }
.avatar { width: 62px; height: 62px; border-radius: 50%; object-fit: cover; border: 2px solid var(--line-2); background: linear-gradient(145deg, #1f7bff, #5b2bd1); display: grid; place-items: center; font-size: 26px; font-weight: 700; flex: none; overflow: hidden; }
.who h3 { font-size: 20px; font-weight: 700; }
.menu { padding: 4px 14px; }
.menu button { width: 100%; display: flex; align-items: center; gap: 12px; padding: 13px 0; background: none; border: 0; border-top: 1px solid rgba(43, 82, 153, 0.35); font-size: 14.5px; text-align: left; cursor: pointer; }
.menu button:first-child { border-top: 0; }
.menu button .ic:last-child { margin-left: auto; color: var(--muted); }
.sitem { display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; padding: 12px 14px; margin-bottom: 10px; cursor: pointer; }
.sitem .t { font-size: 14.5px; font-weight: 600; }
.sitem .s { font-size: 12px; color: var(--muted); }
.sitem .chev { margin-left: auto; color: var(--muted); }
.foot { text-align: center; font-size: 11.5px; color: var(--muted); margin: 16px 8px 0; }
.foot .heart { color: #ff4d6a; }

.notice { border-left: 3px solid var(--gold-2); background: rgba(255, 190, 40, 0.08); padding: 10px 12px; border-radius: 8px; font-size: 12.5px; margin-bottom: 12px; }

label { display: block; font-size: 12.5px; color: var(--muted); margin: 12px 0 5px; }
input { width: 100%; padding: 12px; border-radius: 12px; border: 1px solid var(--line-2); background: #071331; color: var(--text); font: 16px var(--font); }

/* ---------- withdrawal sheet ---------- */
.sheetwrap { position: fixed; inset: 0; z-index: 20; pointer-events: none; }
.sheetwrap .scrim { position: absolute; inset: 0; background: rgba(2, 6, 18, 0.7); opacity: 0; transition: opacity 0.2s; }
.sheetwrap .sheet { position: absolute; left: 0; right: 0; bottom: 0; max-width: 560px; margin: 0 auto; max-height: 92%; overflow-y: auto; background: #0b1731; border: 1px solid var(--line-2); border-bottom: 0; border-radius: 20px 20px 0 0; padding: 16px 16px calc(20px + env(safe-area-inset-bottom)); transform: translateY(100%); transition: transform 0.25s ease; }
.sheetwrap.open { pointer-events: auto; }
.sheetwrap.open .scrim { opacity: 1; }
.sheetwrap.open .sheet { transform: none; }

/* ---------- rules ---------- */
.rules { margin: 0; padding: 0 0 0 18px; color: #cfe0ff; font-size: 13.5px; }
.rules li { margin: 7px 0; padding-left: 2px; }
.rules li::marker { color: var(--gold); }
.textlink { display: block; width: 100%; background: none; border: 0; color: #7db8ff; font-size: 13px; font-weight: 600; text-align: center; padding: 8px; cursor: pointer; }

/* ---------- nav ---------- */
.nav { position: fixed; left: 0; right: 0; bottom: 0; display: flex; justify-content: space-around; max-width: 560px; margin: 0 auto;
  padding: 8px 6px calc(8px + env(safe-area-inset-bottom)); background: rgba(6, 13, 32, 0.94); border-top: 1px solid var(--line); }
.nav[hidden] { display: none; }
.nav[hidden] { display: none; }
.nav button { flex: 1; background: none; border: 0; color: var(--muted); display: grid; justify-items: center; gap: 3px; font: 500 11px var(--font); padding: 6px 0; cursor: pointer; }
.nav .ic { width: 22px; height: 22px; }
.nav button.on { color: var(--gold); font-weight: 600; }
.nav button.on .ic { filter: drop-shadow(0 0 6px rgba(255, 209, 46, 0.6)); }

.toast { position: fixed; left: 50%; bottom: calc(92px + env(safe-area-inset-bottom)); transform: translate(-50%, 20px); opacity: 0; pointer-events: none;
  background: #12244a; border: 1px solid var(--line-2); padding: 10px 16px; border-radius: 12px; font-size: 13.5px; max-width: 88%; text-align: center; transition: all 0.25s ease; z-index: 30; }
.toast.show { opacity: 1; transform: translate(-50%, 0); }
.gate { display: grid; place-content: center; text-align: center; height: 100%; padding: 24px; gap: 12px; }

@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }

  <script type="module">
// Thin API client. It only sends the signed Telegram initData - never balances or user IDs.
const tg = window.Telegram && window.Telegram.WebApp;
const hasTelegram = !!(tg && tg.initData);

async function request(method, path, body) {
  let res;
  try {
    res = await fetch('/api' + path, {
      method,
      headers: { 'Content-Type': 'application/json', Authorization: 'tma ' + (tg ? tg.initData : '') },
      body: body ? JSON.stringify(body) : undefined,
    });
  } catch {
    throw new Error('Cannot reach the server. Check your internet connection and try again.');
  }
  const data = await res.json().catch(() => ({}));
  if (!res.ok) {
    const fallback = res.status === 401 || res.status === 403 ? `Your session could not be verified (HTTP ${res.status}). Close the app and open it again from the bot.`
      : res.status === 404 ? `Server API not found (HTTP 404) at /api${path}.`
      : res.status >= 500 ? `Server error (HTTP ${res.status}). Please try again in a moment.`
      : `Request failed (HTTP ${res.status}). Please try again.`;
    const err = new Error(data.message || fallback);
    err.code = data.code;
    err.data = data;
    throw err;
  }
  return data;
}

const api = {
  config: () => fetch('/api/config').then((r) => (r.ok ? r.json() : {})).catch(() => ({})),
  auth: () => request('POST', '/auth'),
  me: () => request('GET', '/me'),
  startMining: () => request('POST', '/mining/start'),
  claimMining: () => request('POST', '/mining/claim'),
  claimBonus: () => request('POST', '/bonus/claim'),
  activity: () => request('GET', '/activity'),
  withdrawals: () => request('GET', '/withdrawals'),
  exchange: (usdt, address, memo) => request('POST', '/exchange', { usdt, address, memo }),
  payouts: () => fetch('/api/payouts').then((r) => r.json()),
};

// =====================================================================
// OPTIONAL AdsGram module.
// - Loaded lazily; if the SDK or block is unavailable, initAdsgram() returns false
//   and the rest of the app keeps working exactly the same.
// - Used ONLY by the Bonus Center "Watch Ad & Get Bonus" button.
// - The AdsGram blockId is NOT hard-coded here: it comes from the server (/api/config),
//   which reads ADSGRAM_BLOCK_ID from environment variables.
// =====================================================================
let controller = null;

function loadScript(src) {
  return new Promise((resolve, reject) => {
    const s = document.createElement('script');
    s.src = src;
    s.async = true;
    s.onload = resolve;
    s.onerror = reject;
    document.head.appendChild(s);
  });
}

async function initAdsgram(blockId) {
  if (!blockId) return false;
  try {
    await loadScript('https://sad.adsgram.ai/js/sad.min.js');
    if (!window.Adsgram) return false;
    controller = window.Adsgram.init({ blockId: String(blockId) });
    return true;
  } catch {
    controller = null;
    return false;
  }
}

const isAdsAvailable = () => !!controller;

// Returns { status: 'completed' | 'skipped' | 'no_ad' | 'unavailable' }
async function showRewardedAd() {
  if (!controller) return { status: 'unavailable' };
  try {
    const result = await controller.show();
    return { status: result && result.done ? 'completed' : 'skipped' };
  } catch (e) {
    // AdsGram rejects when the user closes the ad early or when no ad is available.
    return { status: e && e.state === 'playing' ? 'skipped' : 'no_ad' };
  }
}

const $ = (s) => document.querySelector(s);
const each = (s, fn) => document.querySelectorAll(s).forEach(fn);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const fmt = (n) => Number(n || 0).toLocaleString('en-US', { maximumFractionDigits: 4 });
const fmtF = (n) => Number(n || 0).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 4 });
const fmtDate = (ms) => new Date(ms).toLocaleString([], { dateStyle: 'medium', timeStyle: 'short' });
const clock = (ms) => {
  const s = Math.max(0, Math.ceil(ms / 1000));
  const p = (n) => String(n).padStart(2, '0');
  const h = Math.floor(s / 3600);
  return (h ? `${p(h)}:` : '') + `${p(Math.floor((s % 3600) / 60))}:${p(s % 60)}`;
};
const fmtDur = (ms) => {
  const m = Math.round(ms / 60000);
  if (m >= 60 && m % 60 === 0) { const h = m / 60; return h + (h === 1 ? ' hour' : ' hours'); }
  return m + (m === 1 ? ' minute' : ' minutes');
};
const RING = 326.7;

// Saved TON wallet address: Telegram CloudStorage (synced across devices), localStorage as fallback.
const TON_ADDR = /^([UEk0]Q[A-Za-z0-9_-]{46}|-?\d:[0-9a-fA-F]{64})$/;
const cloudOK = () => !!(tg && tg.isVersionAtLeast && tg.isVersionAtLeast('6.9') && tg.CloudStorage);
const addrStore = {
  load: () => new Promise((res) => {
    try {
      if (cloudOK()) return tg.CloudStorage.getItem('ton_addr', (err, v) => res(err ? '' : v || ''));
    } catch { /* fall through */ }
    try { res(localStorage.getItem('ton_addr') || ''); } catch { res(''); }
  }),
  save: (v) => {
    try { if (cloudOK()) tg.CloudStorage.setItem('ton_addr', v, () => {}); } catch { /* ignore */ }
    try { localStorage.setItem('ton_addr', v); } catch { /* ignore */ }
  },
};

  const m = S.me; const perMin = m.miningReward / (m.miningDurationMs / 60000);

};

let toastTimer;
function toast(msg) {
  const el = $('#toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 2800);
}
const now = () => Date.now() + S.offset;
const setMe = (me) => { S.me = me; S.offset = me.serverTime - Date.now(); };

function miningInfo() {
  const m = S.me;
  if (!m.miningStartedAt) return { phase: 'idle', pct: 0, left: m.miningDurationMs };
  const elapsed = now() - m.miningStartedAt;
  const left = Math.max(0, m.miningDurationMs - elapsed);
  return { phase: left === 0 ? 'ready' : 'running', pct: Math.min(1, elapsed / m.miningDurationMs), left };
}

// ---------- rendering ----------
const NAV = [['home', 'Home', 'home'], ['mining', 'Mining', 'pick'], ['bonus', 'Bonus', 'gift'], ['referral', 'Referral', 'users'], ['profile', 'Profile', 'user']];
const NAV_OF = { withdrawal: 'profile', payouts: 'profile', settings: 'profile', rules: 'profile' };
$('#nav').innerHTML = NAV.map(([k, l, i]) => `<button data-tab="${k}">${ic(i)}<span>${l}</span></button>`).join('');

function render() {
  $('#view').innerHTML = (S.preview ? '<div class="notice">Preview mode — open CoinForge from Telegram to use your account. Nothing here is saved.</div>' : '') + views[S.tab]();
  const active = NAV_OF[S.tab] || S.tab;
  each('.nav button', (b) => b.classList.toggle('on', b.dataset.tab === active));
  $('#nav').hidden = S.tab === 'settings';
  updateMining();
  updateBonus();
}

function updateMining() {
  if (!S.me) return;
  const m = S.me;
  const i = miningInfo();
  const next = i.phase === 'running' ? clock(i.left) : i.phase === 'ready' ? 'Ready' : '--:--';
  each('[data-role="ring"]', (el) => { el.style.strokeDashoffset = RING * (1 - i.pct); });
  each('[data-role="clock"]', (el) => { el.textContent = i.phase === 'running' ? clock(i.left) : i.phase === 'ready' ? clock(0) : clock(m.miningDurationMs); });
  each('[data-role="clocklabel"]', (el) => { el.textContent = i.phase === 'running' ? 'Time Left' : i.phase === 'ready' ? 'Ready to claim' : 'Session length'; });
  each('[data-role="next"]', (el) => { el.textContent = next; });
  each('[data-role="bar"]', (el) => { el.style.width = Math.floor(i.pct * 100) + '%'; });
  each('[data-role="pct"]', (el) => { el.textContent = Math.floor(i.pct * 100) + '%'; });
  each('[data-role="status"]', (el) => {
    el.className = 'st ' + i.phase;
    el.innerHTML = '<i class="dot"></i>' + (i.phase === 'idle' ? 'Idle' : i.phase === 'running' ? 'Active' : 'Ready to claim');
  });
  each('[data-role="mine-btn"]', (el) => {
    el.textContent = i.phase === 'idle' ? 'Start Mining' : i.phase === 'running' ? 'Mining in progress' : (el.dataset.claim || 'Claim Now');
    el.disabled = i.phase === 'running' || S.busy;
  });
}

function updateBonus() {
  const btn = document.querySelector('[data-role="ad-btn"]');
  if (!btn || !S.me) return;
  const b = S.me.adBonus;
  const wait = b.cooldownUntil - now();
  const note = document.querySelector('[data-role="ad-note"]');
  let msg = '';
  let disabled = S.busy;
  if (!S.adsReady) { disabled = true; msg = 'No ads are available right now. You can keep using everything else in the app.'; }
  else if (b.usedToday >= b.dailyCap) { disabled = true; msg = 'Daily bonus limit reached. Come back tomorrow.'; }
  else if (wait > 0) { disabled = true; msg = `Next bonus available in ${clock(wait)}.`; }
  btn.disabled = disabled;
  if (note && !S.busy) note.textContent = msg;
}

async function refreshMe() { setMe(await api.me()); }

async function go(tab) {
  S.tab = tab;
  render();
  $('#view').scrollTop = 0;
  if (S.preview) return;
  try {
    if (tab === 'withdrawal') {
      S.withdrawals = (await api.withdrawals()).items;
      if (S.tab === 'withdrawal') render();
    } else if (tab === 'payouts') {
      S.payouts = (await api.payouts()).payouts || [];
      if (S.tab === 'payouts') render();
    }
  } catch (e) { toast(e.message); }
}

// ---------- actions ----------
async function guarded(fn) {
  if (S.preview) return toast('Open CoinForge in Telegram to use this feature.');
  if (S.busy) return;
  S.busy = true; updateMining(); updateBonus();
  try { await fn(); } catch (e) { toast(e.message); }
  finally { S.busy = false; updateMining(); updateBonus(); }
}

const actions = {
  mine: () => guarded(async () => {
    const i = miningInfo();
    if (i.phase === 'idle') { setMe(await api.startMining()); toast('Mining started.'); }
    else if (i.phase === 'ready') { setMe(await api.claimMining()); toast(`+${fmt(S.me.miningReward)} FGE added to your balance.`); }
    render();
  }),

  'watch-ad': () => guarded(async () => {
    const note = document.querySelector('[data-role="ad-note"]');
    const r = await showRewardedAd(); // user can close the ad at any time - nothing is lost
    if (r.status === 'skipped') return toast('Ad closed. No problem — nothing changes.');
    if (r.status !== 'completed') return toast('No ad available right now. Try again later.');

    if (note) note.textContent = 'Verifying your bonus…';
    for (let attempt = 0; attempt < 6; attempt++) {
      try {
        setMe(await api.claimBonus());
        toast(`+${fmt(S.me.adBonus.amount)} FGE bonus added.`);
        return render();
      } catch (e) {
        if (e.code !== 'NOT_VERIFIED' || attempt === 5) throw e;
        await new Promise((res) => setTimeout(res, 1500)); // wait for AdsGram's server callback
      }
    }
  }),

  copy: async () => {
    const link = S.me.referralLink;
    try { await navigator.clipboard.writeText(link); }
    catch {
      const ta = document.createElement('textarea');
      ta.value = link; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); ta.remove();
    }
    toast('Referral link copied.');
  },

  share: () => {
    const url = 'https://t.me/share/url?url=' + encodeURIComponent(S.me.referralLink) + '&text=' + encodeURIComponent('Join me on CoinForge and mine FGE!');
    tg.openTelegramLink ? tg.openTelegramLink(url) : window.open(url, '_blank');
  },

  'open-withdraw': () => { const w = $('#sheetwrap'); if (w) w.classList.add('open'); },
  'close-sheet': () => { const w = $('#sheetwrap'); if (w) w.classList.remove('open'); },
  soon: () => toast('Coming soon.'),
};
const FREE_IN_PREVIEW = ['open-withdraw', 'close-sheet', 'soon'];

document.addEventListener('click', (e) => {
  const t = e.target.closest('[data-action],[data-tab],[data-tab-go]');
  if (!t) return;
  if (t.dataset.tab) return go(t.dataset.tab);
  if (t.dataset.tabGo) return go(t.dataset.tabGo);
  if (S.preview && !FREE_IN_PREVIEW.includes(t.dataset.action)) return toast('Open CoinForge in Telegram to use this feature.');
  actions[t.dataset.action]?.();
});

document.addEventListener('submit', (e) => {
  if (e.target.id !== 'ex-form') return;
  e.preventDefault();
  guarded(async () => {
    const addr = $('#ex-address').value.trim();
    if (!TON_ADDR.test(addr)) throw new Error('Enter a valid TON wallet address (starts with UQ or EQ).');
    setMe(await api.exchange($('#ex-usdt').value, addr, $('#ex-memo').value));
    S.addr = addr; addrStore.save(addr);
    toast('Withdrawal requested. Status: pending review.');
    await go('withdrawal');
  });
});

document.addEventListener('input', (e) => {
  if (e.target.id !== 'ex-usdt' || !S.me) return;
  const v = Math.round(Number(e.target.value) * 100) / 100;
  $('#ex-cost').textContent = 'Cost: ' + fmt(v > 0 ? v * S.me.exchange.rate : 0) + ' FGE';
});

// ---------- boot ----------
async function boot() {
  if (!hasTelegram) {
    // Browser preview: the UI opens everywhere, but there is no account, no server calls and no rewards.
    S.preview = true;
    addrStore.load().then((a) => { S.addr = a; });
    setMe({ id: '-', name: 'Guest (preview)', balance: 0, miningEarned: 0, referralEarned: 0, adBonusEarned: 0, totalEarned: 0,
      miningStartedAt: null, miningDurationMs: 4 * 3600000, miningReward: 20, referralCount: 0, activeReferralCount: 0, referralBonus: 10,
      referralLink: 'Open in Telegram to get your link', adBonus: { amount: 2, usedToday: 0, dailyCap: 5, cooldownUntil: 0 },
      exchange: { rate: 1000, minUsdt: 1, hasPending: false }, serverTime: Date.now() });
    $('#nav').hidden = false;
    render();
    return;
  }
  tg.ready();
  tg.expand();
  addrStore.load().then((a) => { S.addr = a; if (S.tab === 'withdrawal' && !document.querySelector('.sheetwrap.open')) render(); });
  try { tg.setHeaderColor('#050c1e'); tg.setBackgroundColor('#050c1e'); } catch { /* older clients */ }

  try {
    const [cfg, me] = await Promise.all([api.config(), api.auth()]);
    setMe(me);
    $('#nav').hidden = false;
    render();
    // Ads are initialised AFTER the app is already usable. Failure here changes nothing else.
    initAdsgram(cfg.adsgram && cfg.adsgram.blockId).then((ok) => { S.adsReady = ok && isAdsAvailable(); if (S.tab === 'bonus') updateBonus(); });
  } catch (e) {
    $('#view').innerHTML = `<div class="gate"><h2>Could not load</h2><p class="muted">${esc(e.message)}</p><button class="btn" onclick="location.reload()">Try again</button></div>`;
    return;
  }

  setInterval(() => { updateMining(); updateBonus(); }, 1000);
  document.addEventListener('visibilitychange', () => { if (!document.hidden) refreshMe().then(() => { if (!S.busy && !document.querySelector('.sheetwrap.open')) render(); }).catch(() => {}); });
}
boot();
  </script>
</body>
  </html>
